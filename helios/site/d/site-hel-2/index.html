<style data-energy-loop="base">/* Energy Loop: blue → cyan → lime. Charts remain open-dashboard components. */
:root{--loop-blue:#0087dc;--loop-cyan:#60d4d2;--loop-lime:#b9e95b;--loop-ink:#163850;--loop-muted:#5f768b;--loop-line:linear-gradient(90deg,#0087dc 0 48%,#60d4d2 48% 82%,#b9e95b 82%)}
body{color:var(--odd-ink)}
.odd-dashboard-page{max-width:1440px;margin-inline:auto;padding:24px 28px 60px}
.odd-dashboard-page:before{content:"";display:block;height:6px;background:var(--loop-line);margin-bottom:24px}
.odd-panel{border:1px solid var(--odd-grid)!important;box-shadow:0 3px 12px #143a5e04!important}
.odd-panel-stat{border-top:3px solid #0087dc!important;background:var(--odd-surface)!important}
.odd-section{margin-top:28px}.odd-section h2{letter-spacing:.035em;color:var(--odd-ink)}
.odd-text{font-size:14px;line-height:1.85}.odd-text strong{color:var(--odd-accent-ink);font-variant-numeric:tabular-nums}
.odd-filters select{border-color:var(--odd-border-strong)!important;border-radius:7px!important}
.loop-integrations{display:flex;gap:12px;align-items:stretch;height:100%;padding:5px;overflow-x:auto}
.loop-integration{position:relative;flex:1;min-width:120px;border:1px solid var(--odd-grid);border-top:3px solid #60d4d2;border-radius:8px;padding:10px 12px;background:var(--odd-surface);display:flex;flex-direction:column;gap:4px}
.loop-integration strong{font-size:13px;color:var(--odd-ink)}.loop-integration small{font-size:11px;color:var(--odd-ink-2)}.loop-integration-count{font-size:10px;color:var(--odd-ink-2);margin-top:auto}
.loop-node{position:absolute;right:10px;top:10px;width:6px;height:6px;background:#a1cc45;border-radius:50%}
.odd-panel-prose{background:var(--odd-surface)!important}
@media(max-width:700px){.odd-dashboard-page{padding:15px 12px 40px}.loop-integrations{flex-wrap:wrap;overflow:auto}.loop-integration{min-width:100px}.odd-text{font-size:13px}}
@media print{.odd-sidebar,.odd-topbar,.odd-filters{display:none!important}.odd-panel{break-inside:avoid}.odd-dashboard-page{padding:0}}
.loop-masthead{font-family:Inter,system-ui,sans-serif;display:flex;gap:28px;align-items:center;justify-content:space-between;padding:15px 30px;background:#fff;border-bottom:1px solid #dce7f1;min-height:66px;box-sizing:border-box}
.loop-wordmark{display:flex;gap:10px;align-items:center;font-size:16px;color:#12324c;line-height:1.2}.loop-wordmark strong{font-weight:700}.loop-wordmark small{display:block;font-size:9px;letter-spacing:.2em;color:#0087dc;margin-top:5px}
.loop-brand-mark{width:27px;height:27px;display:block;border:4px solid #0087dc;border-right-color:#60d4d2;border-top-color:#b9e95b;box-sizing:border-box}
.loop-masthead nav{display:flex;gap:5px;background:#eef5fb;border-radius:8px;padding:4px}.loop-masthead nav a{font-size:13px;padding:7px 14px;text-decoration:none;color:#466579;border-radius:5px}.loop-masthead nav a[aria-current]{background:#0087dc;color:white;box-shadow:0 2px 6px #0087dc20}.loop-snapshot-label{font-size:11px;color:#5d788c;letter-spacing:.05em}
@media(max-width:700px){.loop-masthead{padding:12px;gap:10px;flex-wrap:wrap}.loop-masthead nav{margin-left:auto}.loop-snapshot-label{display:none}.loop-masthead nav a{font-size:11px;padding:7px 10px}}
@media print{.loop-masthead nav,.loop-snapshot-label{display:none}.loop-masthead{padding:0 0 18px;border:0}}

.odd-sidebar{background:var(--odd-sidebar)!important;border-color:var(--odd-border)!important}.odd-topbar{background:var(--odd-surface)!important;border-color:var(--odd-border)!important}
/* Reader controls and personal layouts; all chart/query rendering stays native. */
.loop-theme-control{display:flex;align-items:center;gap:8px;font-size:12px;color:#163850;white-space:nowrap}.loop-theme-control select{font:inherit;background:#fff;color:#163850;border:1px solid #a9c4d7;border-radius:6px;padding:7px}
.loop-layout-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;margin-bottom:22px;border:1px solid var(--odd-grid);border-radius:8px;background:var(--odd-surface);color:var(--odd-ink)}
.loop-layout-toolbar strong{font-size:14px}.loop-layout-toolbar small{display:block;font-size:12px;color:var(--odd-ink-2);margin-top:4px}.loop-layout-toolbar>div{margin-right:auto}
.loop-layout-toolbar button,.loop-widget-controls button{font:inherit;padding:7px 10px;border:1px solid var(--odd-border-strong);border-radius:5px;background:var(--odd-surface);color:var(--odd-ink);cursor:pointer}.loop-layout-toolbar button[aria-pressed=true]{background:var(--odd-accent);color:#0b0b0b}.loop-layout-toolbar button:disabled,.loop-widget-controls button:disabled{opacity:.45;cursor:default}
.loop-layout-status{font-size:12px;color:var(--odd-ink-2)}.loop-widget-library{background:var(--odd-surface);color:var(--odd-ink);border:1px solid var(--odd-grid);padding:16px;margin-bottom:20px;border-radius:8px}.loop-widget-library summary{cursor:pointer;font-weight:600}.loop-widget-library p{font-size:13px;color:var(--odd-ink-2)}.loop-widget-library>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.loop-widget-library label{display:flex;align-items:center;gap:8px;font-size:13px}
.loop-personal-widget{grid-column:span var(--loop-span,12);min-width:0}.loop-personal-widget[data-dragging]{opacity:.5}.loop-widget-content{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));min-width:0}.loop-widget-controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--odd-surface);border:1px dashed var(--odd-accent);border-radius:7px 7px 0 0;padding:8px;font-size:12px;color:var(--odd-ink)}.loop-widget-controls label{display:flex;align-items:center;gap:4px}.loop-widget-controls select,.loop-widget-controls input{width:65px;font:inherit;color:var(--odd-ink);background:var(--odd-surface);border:1px solid var(--odd-border-strong);padding:5px;border-radius:4px}.loop-drag-handle{cursor:grab!important;touch-action:none;user-select:none}.loop-layout-empty{grid-column:1/-1;padding:30px;background:var(--odd-surface);color:var(--odd-ink)}
@media(max-width:700px){.loop-personal-widget{grid-column:1/-1}.loop-layout-toolbar{padding:12px}.loop-layout-status{width:100%}.loop-masthead{gap:8px}.loop-theme-control{margin-left:auto}.loop-snapshot-label{display:none}}
@media print{.loop-layout-toolbar,.loop-widget-library,.loop-widget-controls,.loop-theme-control{display:none!important}}

<script>// Reader appearance only; layout editing lives in the React dashboard component.
(()=>{
 const select=document.getElementById('loop-theme');if(!select)return;
 const root=document.documentElement;
 const sync=()=>{select.value=['light','dark'].includes(root.dataset.theme)?root.dataset.theme:'system'};
 try{const value=localStorage.getItem('odd:theme');if(['light','dark'].includes(value))root.dataset.theme=value}catch{}
 sync();
 select.addEventListener('change',()=>{
  const value=select.value;
  if(value==='system')delete root.dataset.theme;else root.dataset.theme=value;
  try{if(value==='system')localStorage.removeItem('odd:theme');else localStorage.setItem('odd:theme',value)}catch{}
 });
 new MutationObserver(sync).observe(root,{attributes:true,attributeFilter:['data-theme']});
 window.addEventListener('storage',event=>{if(event.key==='odd:theme'){if(['light','dark'].includes(event.newValue))root.dataset.theme=event.newValue;else delete root.dataset.theme}});
})();
</script></body>
